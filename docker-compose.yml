services:
  db:
    image: postgres:17-alpine
    container_name: taiphanvan-dev-db
    restart: unless-stopped
    ports:
      - "5433:5432" # 5433 host → 5432 container, tránh đè postgres global nếu có
    environment:
      POSTGRES_USER: taiphanvan
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: taiphanvan_dev
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiphanvan -d taiphanvan_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  dev-db:
